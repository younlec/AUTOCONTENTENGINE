services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autocontent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/autocontent
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/autocontent
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-ant-placeholder}
      TREND_DISCOVERY_INTERVAL_MS: ${TREND_DISCOVERY_INTERVAL_MS:-1800000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000
      NEXT_PUBLIC_WS_URL: http://backend:4000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
 volumes:
            - name: NPM SemVer
  # You may pin to the exact commit or the version.
  # uses: odinr/action-npm-semver@37020c4b623853993ecaa7dd0f3d99b9ad5f2c2f
  uses: odinr/action-npm-semver@v1
  with:
    # github access token (used for 'version.latest')
    token: # optional, default is ${{ github.token }}
    # repo owner (used for 'version.latest')
    owner: # optional
    # repo repo (used for 'version.latest')
    repo: # optional
    # name of tag/ref, version, 'latest' or 'current'
    version: # optional
    # increase version. when prerelease a provide the type of bump and tag, divided by space (prerelease pr9)
    bump: # optional

                      - name: NPM Publisher
  # You may pin to the exact commit or the version.
  # uses: lyzhang1999/npm-publish@61d419d5bb515116b1745c3da8575d37c58edff7
  uses: lyzhang1999/npm-publish@v1.0.2
  with:
    # The NPM access token to use when publishing
    token: 
    # The NPM registry URL to use
    registry: # optional, default is https://registry.npmjs.org/
    # The path of your package.json file
    package: # optional, default is package.json
    # The tag to publish to. This allows people to install the package using "npm install <package-name>@<tag>".
    tag: # optional, default is latest
    # Determines whether the published package should be publicly visible, or restricted to members of your NPM organization. This only applies to scoped packages.
    access: # optional
    # If true, run with the --dry-run flag
    dry-run: # optional, default is false
    # Only publish if the version in package.json differs from the latest on NPM
    check-version: # optional, default is true
    # Only publish to NPM if the version number in package.json is greater than the latest on NPM
    greater-version-only: # optional, default is false
          
