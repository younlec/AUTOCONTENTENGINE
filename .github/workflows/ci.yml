name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autocontent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autocontent_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret

  lint-and-build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  build-and-push-images:
    needs: [lint-and-test-backend, lint-and-build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/worker:latest,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/worker:${{ github.sha }}

  deploy:
    needs: build-and-push-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/autocontent-engine
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
             volumes:
            - name: NPM SemVer
  # You may pin to the exact commit or the version.
  # uses: odinr/action-npm-semver@37020c4b623853993ecaa7dd0f3d99b9ad5f2c2f
  uses: odinr/action-npm-semver@v1
  with:
    # github access token (used for 'version.latest')
    token: # optional, default is ${{ github.token }}
    # repo owner (used for 'version.latest')
    owner: # optional
    # repo repo (used for 'version.latest')
    repo: # optional
    # name of tag/ref, version, 'latest' or 'current'
    version: # optional
    # increase version. when prerelease a provide the type of bump and tag, divided by space (prerelease pr9)
    bump: # optional

                      - name: NPM Publisher
  # You may pin to the exact commit or the version.
  # uses: lyzhang1999/npm-publish@61d419d5bb515116b1745c3da8575d37c58edff7
  uses: lyzhang1999/npm-publish@v1.0.2
  with:
    # The NPM access token to use when publishing
    token: 
    # The NPM registry URL to use
    registry: # optional, default is https://registry.npmjs.org/
    # The path of your package.json file
    package: # optional, default is package.json
    # The tag to publish to. This allows people to install the package using "npm install <package-name>@<tag>".
    tag: # optional, default is latest
    # Determines whether the published package should be publicly visible, or restricted to members of your NPM organization. This only applies to scoped packages.
    access: # optional
    # If true, run with the --dry-run flag
    dry-run: # optional, default is false
    # Only publish if the version in package.json differs from the latest on NPM
    check-version: # optional, default is true
    # Only publish to NPM if the version number in package.json is greater than the latest on NPM
    greater-version-only: # optional, default is false
          
